# Checks every push and pull request: types, the build, and the end-to-end tests (Chrome).
# All three browsers (Chrome, Firefox, WebKit) run once a week and on demand (Actions → CI → Run workflow).
# Deploys are done by Coolify from main; this is the safety net in front of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 20 * * 0' # Sundays 20:30 UTC (Monday 02:15 in Kathmandu)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Browsers
        run: npx playwright install --with-deps ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium firefox webkit' || 'chromium' }}

      - name: Tests
        run: npx playwright test ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '' || '--project=chromium' }}

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
